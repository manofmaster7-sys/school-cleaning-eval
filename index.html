<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج تقييم نظافة المدرسة</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
    }
    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
      height: 90px;
    }
    button {
      width: 100%;
      background-color: #27ae60;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #219150;
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      display: none;
      font-weight: bold;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>استمارة تقييم نظافة المدرسة</h2>
  
  <form id="evaluationForm">
    <div class="form-group">
      <label for="shift">الدوام:</label>
      <select id="shift" required>
        <option value="">اختر الدوام...</option>
        <option value="الدوام الصباحي">الدوام الصباحي</option>
        <option value="الدوام المسائي">الدوام المسائي</option>
      </select>
    </div>

    <div class="form-group">
      <label for="location">المكان:</label>
      <input type="text" id="location" placeholder="مثال: الطابق الثاني / الساحة" required>
    </div>

    <div class="form-group">
      <label for="task">المهمة:</label>
      <input type="text" id="task" placeholder="مثال: تنظيف الحمامات / القاعات" required>
    </div>

    <div class="form-group">
      <label for="supervisor">اسم المشرف:</label>
      <input type="text" id="supervisor" placeholder="أدخل اسم المشرف" required>
    </div>

    <div class="form-group">
      <label for="students">أسماء الطلاب المشرفين:</label>
      <input type="text" id="students" placeholder="أدخل أسماء الطلاب">
    </div>

    <div class="form-group">
      <label for="note">ملاحظات إضافية:</label>
      <textarea id="note" placeholder="أي ملاحظات أخرى..."></textarea>
    </div>

    <div class="form-group">
      <label for="files">إرفاق صور (يمكن اختيار أكثر من صورة):</label>
      <input type="file" id="files" accept="image/*" multiple>
    </div>

    <button type="submit" id="submitBtn">إرسال التقييم</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  // رابط Google Apps Script الخاص بك
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRkXIWbHcd68OAamj1bJDmDPZmIWf7c6IYmK-FJO6W0LAyA2IhYIm3ZzNleMGh_6ym/exec";

  document.getElementById("evaluationForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("statusMessage");

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري الإرسال والمعالجة...";
    statusDiv.style.display = "none";

    try {
      // 1. قراءة الملفات المرفقة وتحويلها لـ Base64
      const fileInput = document.getElementById("files");
      const filesList = [];

      if (fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
          const file = fileInput.files[i];
          const base64Data = await convertFileToBase64(file);
          filesList.push({
            data: base64Data,
            type: file.type
          });
        }
      }

      // 2. تجميع البيانات في كائن JSON
      const payload = {
        shift: document.getElementById("shift").value,
        location: document.getElementById("location").value,
        task: document.getElementById("task").value,
        supervisor: document.getElementById("supervisor").value,
        students: document.getElementById("students").value,
        note: document.getElementById("note").value,
        files: filesList
      };

      // 3. إرسال الطلب لـ Google Apps Script
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        statusDiv.className = "success";
        statusDiv.innerText = " تم إرسال التقييم وحفظ البيانات والصور بنجاح!";
        statusDiv.style.display = "block";
        document.getElementById("evaluationForm").reset();
      } else {
        throw new Error(result.message || "حدث خطأ غير معروف أثناء الحفظ.");
      }

    } catch (err) {
      statusDiv.className = "error";
      statusDiv.innerText = " حدث خطأ أثناء الإرسال: " + err.message;
      statusDiv.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "إرسال التقييم";
    }
  });

  // دالة تحويل الملفات إلى Base64
  function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }
</script>

</body>
</html>

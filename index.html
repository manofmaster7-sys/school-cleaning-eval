```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تقييم نظافة مدرسة المناهل الدولية</title>

<style>

* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
}

body {
    background-color: #f4f7f6;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 30px;
    background-color: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    width: 100%;
    position: relative;
}

.header-title-container {
    text-align: center;
    flex: 1;
}

.header-title {
    font-size: 24px;
    font-weight: bold;
    color: #1a5b8c;
    line-height: 1.2;
}

.header-subtitle {
    font-size: 15px;
    color: #555;
    font-weight: 600;
    margin-top: 5px;
}

.lang-btn {
    position: absolute;
    left: 30px;
    background-color: #1a5b8c;
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s ease;
}

.lang-btn:hover {
    background-color: #14446a;
}

.page {
    display: none;
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
}

.active-page {
    display: block;
}

#home-page {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-top: 180px;
}

#home-page.active-page {
    display: flex;
}

.btn-main {
    background-color: #28a745;
    color: white;
    padding: 20px 50px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 12px rgba(40, 167, 69, 0.3);
}

.btn-main:hover {
    background-color: #218838;
    transform: translateY(-2px);
}

.form-container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    margin-top: 20px;
}

.controls-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

select,
input[type="text"] {
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    flex: 1;
    min-width: 200px;
    outline: none;
}

select:focus,
input[type="text"]:focus {
    border-color: #1a5b8c;
}

.upload-section {
    text-align: center;
    margin-top: 20px;
    border-top: 1px solid #eee;
    padding-top: 25px;
}

.btn-upload {
    background-color: #17a2b8;
    color: white;
    padding: 14px 30px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: inline-block;
    font-weight: bold;
}

#file-input-camera {
    display: none;
}

.file-info {
    margin-top: 12px;
    font-size: 15px;
    color: #666;
    font-weight: 500;
}

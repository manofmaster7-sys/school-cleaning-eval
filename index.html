<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم نظافة مدرسة المناهل الدولية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
        }
        .logo-box {
            width: 120px;
            display: flex;
            align-items: center;
        }
        .logo-box.right { justify-content: flex-start; }
        .logo-box.left { justify-content: flex-end; }
        .logo {
            max-height: 75px;
            max-width: 100%;
            object-fit: contain;
        }
        .header-title-container {
            text-align: center;
            flex: 1;
        }
        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a5b8c;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 15px;
            color: #555;
            font-weight: 600;
            margin-top: 5px;
        }
        .page {
            display: none;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .active-page { display: block; }

        #home-page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 180px; 
        }
        #home-page.active-page { display: flex; }
        
        .btn-main {
            background-color: #28a745;
            color: white;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(40, 167, 69, 0.3);
        }
        .btn-main:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        select, input[type="text"] {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 200px;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #1a5b8c;
        }
        .upload-section {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        .btn-upload {
            background-color: #007bff;
            color: white;
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
        }
        #file-input { display: none; }
        .file-info {
            margin-top: 12px;
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }
        .submit-btn-wrapper {
            margin-top: 25px;
            text-align: center;
        }
        .btn-submit {
            background-color: #1a5b8c;
            color: white;
            padding: 14px 45px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            header { padding: 10px; }
            .logo-box { width: 70px; }
            .logo { max-height: 50px; }
            .header-title { font-size: 15px; }
            .header-subtitle { font-size: 11px; }
            #home-page { padding-top: 120px; }
            .btn-main { font-size: 20px; padding: 16px 35px; }
            .controls-wrapper { flex-direction: column; }
            select, input[type="text"] { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box right">
            <img src="school-logo.png" alt="شعار المدرسة" class="logo" onerror="this.src='https://via.placeholder.com/100x70?text=شعار+المدرسة'">
        </div>
        <div class="header-title-container">
            <div class="header-title">تقييم نظافة المدرسة</div>
            <div class="header-subtitle">للعام الدراسي 2026 - 2027</div>
        </div>
        <div class="logo-box left">
            <img src="assoc-logo.png" alt="شعار الجمعية" class="logo" onerror="this.src='https://via.placeholder.com/100x70?text=شعار+الجمعية'">
        </div>
    </header>

    <div id="home-page" class="page active-page">
        <button class="btn-main" onclick="navigateTo('task-page')">مهمة جديدة</button>
    </div>

    <div id="task-page" class="page">
        <div class="form-container">
            <div class="controls-wrapper">
                <select id="shift-select">
                    <option value="" disabled selected>اختر الدوام</option>
                    <option value="دوام القيد الرسمي">دوام القيد الرسمي</option>
                    <option value="الدوام المسائي">الدوام المسائي</option>
                    <option value="دوام سبت وأحد">دوام سبت وأحد</option>
                </select>

                <!-- قائمة اختر المكان مع التعديل الجديد -->
                <select id="location-select">
                    <option value="" disabled selected>اختر المكان</option>
                    <option value="الساحات الرئيسية">الساحات الرئيسية</option>
                    <option value="الطابق الأول">الطابق الأول</option>
                    <option value="الطابق الثاني">الطابق الثاني</option>
                    <option value="الطابق الثالث">الطابق الثالث</option>
                    <option value="الطابق الرابع">الطابق الرابع</option>
                    <option value="الطابق الخامس">الطابق الخامس</option>
                    <option value="الطابق السادس">الطابق السادس</option>
                    <option value="الدرج المفرد">الدرج المفرد</option>
                    <option value="الدرج المزدوج">الدرج المزدوج</option>
                </select>

                <!-- قائمة اختر المهمة مع إضافة الدرج المفرد والمزدوج -->
                <select id="task-select">
                    <option value="" disabled selected>اختر المهمة</option>
                    <option value="الصف">الصف</option>
                    <option value="ساحة الطابق">ساحة الطابق</option>
                    <option value="حمامات الطابق">حمامات الطابق</option>
                    <option value="غرفة المعلمين">غرفة المعلمين</option>
                    <option value="بلكون">بلكون</option>
                    <option value="غرفة التوجيه">غرفة التوجيه</option>
                    <option value="المرسم">المرسم</option>
                    <option value="مختبر الحاسوب">مختبر الحاسوب</option>
                    <option value="المكتبة">المكتبة</option>
                    <option value="غرفة الألعاب">غرفة الألعاب</option>
                    <option value="مختبر اللغة التركية">مختبر اللغة التركية</option>
                    <option value="المعرض">المعرض</option>
                    <option value="غرفة الطباعة">غرفة الطباعة</option>
                    <option value="الدرج المفرد">الدرج المفرد</option>
                    <option value="الدرج المزدوج">الدرج المزدوج</option>
                </select>

                <input type="text" id="custom-note" placeholder="ملاحظات إضافية (اختياري)...">
            </div>

            <div class="upload-section">
                <input type="file" id="file-input" accept="image/*" multiple capture="environment" onchange="handleFileSelect(event)">
                <label for="file-input" class="btn-upload">تحميل الصور (الكاميرا / المعرض)</label>
                <div class="file-info" id="file-count">لم يتم اختيار أي صور بعد (الحد الأقصى 10 صور)</div>
            </div>

            <div class="submit-btn-wrapper">
                <button class="btn-submit" id="submit-btn" onclick="uploadDataToDrive()">إرسال التقييم إلى Drive</button>
            </div>
        </div>
    </div>

    <!-- نموذج وiframe مخفيان لضمان الرفع دون حظر المتصفح -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitting){onUploadComplete();}"></iframe>
    <form id="hidden-form" action="https://script.google.com/macros/s/AKfycbwwpnwve5SsEGvMlTslXLacNPyoXLtwEvshXsi5zJk1yTNpV83c22FK-Y_OIn11VIw4Mg/exec" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="payload" id="payload-input">
    </form>

    <script>
        let selectedFiles = [];
        let isSubmitting = false;

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            if (files.length > 10) {
                alert("يمكنك اختيار 10 صور كحد أقصى فقط.");
                event.target.value = "";
                return;
            }
            selectedFiles = files;
            document.getElementById('file-count').innerText = `تم اختيار ${selectedFiles.length} صورة من أصل 10.`;
        }

        function resizeImage(file, maxWidth = 800, quality = 0.5) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve({
                            name: file.name,
                            type: 'image/jpeg',
                            data: canvas.toDataURL('image/jpeg', quality)
                        });
                    };
                };
            });
        }

        async function uploadDataToDrive() {
            if (selectedFiles.length === 0) {
                alert("يرجى اختيار أو التقاط صورة واحدة على الأقل أولاً.");
                return;
            }

            const shift = document.getElementById('shift-select').value;
            const location = document.getElementById('location-select').value;
            const task = document.getElementById('task-select').value;

            if (!shift || !location || !task) {
                alert("يرجى تعبئة كافة الشرائط المنسدلة الثلاثة.");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الإرسال...";

            try {
                const compressedFiles = await Promise.all(
                    selectedFiles.map(file => resizeImage(file))
                );

                const payload = {
                    shift: shift,
                    location: location,
                    task: task,
                    note: document.getElementById('custom-note').value,
                    files: compressedFiles
                };

                document.getElementById('payload-input').value = JSON.stringify(payload);
                isSubmitting = true;

                document.getElementById('hidden-form').submit();

            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء معالجة الصور، يرجى المحاولة مجدداً.");
                submitBtn.disabled = false;
                submitBtn.innerText = "إرسال التقييم إلى Drive";
                isSubmitting = false;
            }
        }

        function onUploadComplete() {
            alert("تم الإرسال وحفظ المجلدات والصور بنجاح في Google Drive!");
            isSubmitting = false;
            selectedFiles = [];
            document.getElementById('file-count').innerText = "لم يتم اختيار أي صور بعد (الحد الأقصى 10 صور)";
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.innerText = "إرسال التقييم إلى Drive";
            navigateTo('home-page');
        }
    </script>
</body>
</html>

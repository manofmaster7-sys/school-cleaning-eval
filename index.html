<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استمارة تقييم نظافة المدرسة</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #27ae60;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--primary-color);
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-color);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #f1f1f1;
      border-radius: 6px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #219150;
    }

    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      display: none;
      font-weight: bold;
    }

    .status-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>استمارة تقييم نظافة المدرسة</h2>
    
    <form id="evaluationForm">
      <div class="form-group">
        <label for="shift">الدوام:</label>
        <select id="shift" name="shift" required>
          <option value="">-- اختر الدوام --</option>
          <option value="الدوام الصباحي">الدوام الصباحي</option>
          <option value="الدوام المسائي">الدوام المسائي</option>
        </select>
      </div>

      <div class="form-group">
        <label for="location">المكان:</label>
        <input type="text" id="location" name="location" placeholder="مثال: الطابق الثاني / الساحة الشرقية" required>
      </div>

      <div class="form-group">
        <label for="task">المهمة / النطاق:</label>
        <input type="text" id="task" name="task" placeholder="مثال: نظافة الحمامات / مسح الممرات" required>
      </div>

      <div class="form-group">
        <label for="supervisor">اسم المشرف:</label>
        <input type="text" id="supervisor" name="supervisor" placeholder="أدخل اسم المشرف المسؤول" required>
      </div>

      <div class="form-group">
        <label for="students">أسماء الطلاب المشرفين / المتابعين:</label>
        <input type="text" id="students" name="students" placeholder="أدخل أسماء الطلاب">
      </div>

      <div class="form-group">
        <label for="note">ملاحظات إضافية:</label>
        <textarea id="note" name="note" placeholder="أي ملاحظات حول التقييم..."></textarea>
      </div>

      <div class="form-group">
        <label for="fileInput">إرفاق صور (يمكن اختيار أكثر من صورة):</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>

      <button type="submit" id="submitBtn">إرسال التقييم</button>
    </form>

    <div id="statusMessage" class="status-message"></div>
  </div>

  <script>
    // رابط السكريبت الجديد الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRkXIWbHcd68OAamj1bJDmDPZmIWf7c6IYmK-FJO6W0LAyA2IhYIm3ZzNleMGh_6ym/exec";

    const form = document.getElementById("evaluationForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");

    // تحويل الملفات إلى Base64
    const convertFileToBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          name: file.name,
          type: file.type,
          data: reader.result
        });
        reader.onerror = (error) => reject(error);
      });
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "جاري الإرسال...";
      statusMessage.style.display = "none";

      try {
        const fileInput = document.getElementById("fileInput");
        const filePromises = Array.from(fileInput.files).map(convertFileToBase64);
        const encodedFiles = await Promise.all(filePromises);

        const payload = {
          shift: document.getElementById("shift").value,
          location: document.getElementById("location").value,
          task: document.getElementById("task").value,
          supervisor: document.getElementById("supervisor").value,
          students: document.getElementById("students").value,
          note: document.getElementById("note").value,
          files: encodedFiles
        };

        // الإرسال كـ Form Data لتفادي قيود CORS البرمجية مع Google Apps Script
        const formData = new FormData();
        formData.append("payload", JSON.stringify(payload));

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        // إظهار رسالة النجاح وتصفير النموذج
        statusMessage.className = "status-message success";
        statusMessage.innerText = "تم إرسال التقييم وحفظ الصور والتقرير بنجاح!";
        statusMessage.style.display = "block";
        form.reset();

      } catch (error) {
        console.error("Error:", error);
        statusMessage.className = "status-message error";
        statusMessage.innerText = "حدث خطأ أثناء الإرسال. يرجى المحاولة لاحقاً.";
        statusMessage.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "إرسال التقييم";
      }
    });
  </script>
</body>
</html>

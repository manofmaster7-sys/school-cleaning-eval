<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم النظافة في المدرسة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            position: relative;
        }
        .header-logo-container {
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-logo-container.left-side {
            gap: 10px;
            width: auto;
        }
        .logo {
            max-height: 70px;
            max-width: 100px;
            object-fit: contain;
        }
        .header-title-container {
            text-align: center;
            flex: 1;
        }
        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a5b8c;
            line-height: 1.2;
        }
        .lang-btn {
            background-color: #1a5b8c;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
        }
        .lang-btn:hover {
            background-color: #14446a;
        }
        .page {
            display: none;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .active-page { display: block; }

        #home-page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 180px; 
        }
        #home-page.active-page { display: flex; }
        
        .btn-main {
            background-color: #28a745;
            color: white;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(40, 167, 69, 0.3);
        }
        .btn-main:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: bold;
            font-size: 14px;
            color: #1a5b8c;
        }
        select, input[type="text"], textarea {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #1a5b8c;
        }
        .upload-section {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        .btn-upload {
            background-color: #17a2b8;
            color: white;
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
        }
        #file-input-camera { display: none; }
        
        .file-info {
            margin-top: 12px;
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .preview-item {
            position: relative;
            width: 85px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(220, 53, 69, 0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .submit-btn-wrapper {
            margin-top: 25px;
            text-align: center;
        }
        .btn-submit {
            background-color: #1a5b8c;
            color: white;
            padding: 14px 45px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            header { padding: 10px; }
            .header-logo-container { width: 50px; }
            .logo { max-height: 45px; max-width: 50px; }
            .header-title { font-size: 15px; }
            .lang-btn { padding: 5px 8px; font-size: 12px; }
            #home-page { padding-top: 120px; }
            .btn-main { font-size: 20px; padding: 16px 35px; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo-container">
            <img src="assoc-logo.png" alt="شعار المدرسة" class="logo" onerror="this.src='https://via.placeholder.com/80x60?text=المدرسة'">
        </div>

        <div class="header-title-container">
            <div class="header-title" id="txt-header-title">تقييم النظافة في المدرسة</div>
        </div>

        <div class="header-logo-container left-side">
            <button class="lang-btn" id="lang-btn" onclick="toggleLanguage()">TR</button>
            <img src="assoc-logo.png" alt="شعار المدرسة" class="logo" onerror="this.src='https://via.placeholder.com/80x60?text=المدرسة'">
        </div>
    </header>

    <div id="home-page" class="page active-page">
        <button class="btn-main" id="txt-btn-main" onclick="navigateTo('task-page')">مهمة جديدة</button>
    </div>

    <div id="task-page" class="page">
        <div class="form-container">
            <div class="controls-wrapper">
                <!-- الصف الأول: الموقع والمهمة -->
                <div class="form-row">
                    <div class="form-group">
                        <label id="lbl-location">المكان / الطابق</label>
                        <select id="location-select"></select>
                    </div>
                    <div class="form-group">
                        <label id="lbl-task">المهمة / القسم</label>
                        <select id="task-select"></select>
                    </div>
                </div>

                <!-- الصف الثاني: اسم المشرف والطلاب المشرفين -->
                <div class="form-row">
                    <div class="form-group">
                        <label id="lbl-supervisor">اسم المشرف</label>
                        <input type="text" id="supervisor-input" placeholder="أدخل اسم المشرف">
                    </div>
                    <div class="form-group">
                        <label id="lbl-students">أسماء الطلاب المشرفين</label>
                        <textarea id="students-input" placeholder="أدخل أسماء الطلاب المشرفين"></textarea>
                    </div>
                </div>
            </div>

            <div class="upload-section">
                <input type="file" id="file-input-camera" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
                <label for="file-input-camera" class="btn-upload" id="txt-btn-upload">📸 التقاط صورة بالكاميرا</label>
                <div class="file-info" id="file-count">لم يتم التقاط أي صور بعد (الحد الأقصى 10 صور)</div>
                <div class="preview-grid" id="preview-grid"></div>
            </div>

            <div class="submit-btn-wrapper">
                <button class="btn-submit" id="submit-btn" onclick="uploadDataToDrive()">إرسال التقييم إلى Drive</button>
            </div>
        </div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitting){onUploadComplete();}"></iframe>
    <form id="hidden-form" action="https://script.google.com/macros/s/AKfycbzc3pTRX2IrajOgrfv3DyIH9yQWos-WPpxIymCdlkUb3CHFvB6WY7VHErnORZ6AWUk-GA/exec" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="payload" id="payload-input">
    </form>

    <script>
        let selectedFiles = [];
        let isSubmitting = false;
        let currentLang = 'ar';

        const translations = {
            ar: {
                headerTitle: "تقييم النظافة في المدرسة",
                btnMain: "مهمة جديدة",
                lblLocation: "المكان / الطابق",
                lblTask: "المهمة / القسم",
                lblSupervisor: "اسم المشرف",
                phSupervisor: "أدخل اسم المشرف",
                lblStudents: "أسماء الطلاب المشرفين",
                phStudents: "أدخل أسماء الطلاب المشاركين",
                btnUpload: "📸 التقاط صورة بالكاميرا",
                btnSubmit: "إرسال التقييم إلى Drive",
                btnSubmitting: "جاري الإرسال...",
                fileCountZero: "لم يتم التقاط أي صور بعد (الحد الأقصى 10 صور)",
                fileCountText: (count) => `تم التقاط ${count} صورة من أصل 10`,
                msgMaxFiles: "وصلت للحد الأقصى المسموح به (10 صور).",
                msgNoFiles: "يرجى التقاط صورة واحدة على الأقل أولاً.",
                msgFillFields: "يرجى اختيار المكان والمهمة وإدخال اسم المشرف.",
                msgError: "حدث خطأ أثناء معالجة الصور والبيانات، يرجى المحاولة مجدداً.",
                msgSuccess: "تم الإرسال وحفظ المستند النصي والصور بنجاح في Google Drive!",
                locations: [
                    { val: "", text: "اختر المكان", disabled: true },
                    { val: "الطابق الأول", text: "الطابق الأول" },
                    { val: "الطابق الثاني", text: "الطابق الثاني" }
                ],
                tasks: [
                    { val: "", text: "اختر المهمة", disabled: true },
                    { val: "الساحات", text: "الساحات" },
                    { val: "الحمامات", text: "الحمامات" },
                    { val: "المكاتب", text: "المكاتب" },
                    { val: "النطق", text: "النطق" },
                    { val: "المطبخ", text: "المطبخ" }
                ]
            },
            tr: {
                headerTitle: "Okul Temizlik Değerlendirmesi",
                btnMain: "Yeni Görev",
                lblLocation: "Konum / Kat",
                lblTask: "Görev / Bölüm",
                lblSupervisor: "Gözetmen Adı",
                phSupervisor: "Gözetmen adını giriniz",
                lblStudents: "Gözetmen Öğrencilerin Adları",
                phStudents: "Katılan öğrencilerin adlarını giriniz",
                btnUpload: "📸 Kamera ile Fotoğraf Çek",
                btnSubmit: "Değerlendirmeyi Drive'a Gönder",
                btnSubmitting: "Gönderiliyor...",
                fileCountZero: "Henüz fotoğraf çekilmedi (Maksimum 10 fotoğraf)",
                fileCountText: (count) => `10 fotoğraftan ${count} tanesi çekildi`,
                msgMaxFiles: "İzin verilen maksimum sınıra ulaştınız (10 fotoğraf).",
                msgNoFiles: "Lütfen önce en az bir fotoğraf çekin.",
                msgFillFields: "Lütfen konum, görev ve gözetmen adını doldurun.",
                msgError: "Hata oluştu, lütfen tekrar deneyين.",
                msgSuccess: "Başarıyla gönderildi ve metin belgesi ile fotoğraflar Google Drive'a kaydedildi!",
                locations: [
                    { val: "", text: "Konum Seçin", disabled: true },
                    { val: "الطابق الأول", text: "1. Kat" },
                    { val: "الطابق الثاني", text: "2. Kat" }
                ],
                tasks: [
                    { val: "", text: "Görev Seçin", disabled: true },
                    { val: "الساحات", text: "Meydanlar / Bahçeler" },
                    { val: "الحمامات", text: "Tuvaletler" },
                    { val: "المكاتب", text: "Ofisler" },
                    { val: "النطق", text: "Konuşma Terapisi Odası" },
                    { val: "المطبخ", text: "Mutfak" }
                ]
            }
        };

        function populateSelect(selectId, items) {
            const select = document.getElementById(selectId);
            const currentVal = select.value;
            select.innerHTML = "";
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.val;
                opt.textContent = item.text;
                if (item.disabled) opt.disabled = true;
                select.appendChild(opt);
            });
            select.value = currentVal;
            if(!select.value && items.length > 0) select.selectedIndex = 0;
        }

        function updateLanguageUI() {
            const t = translations[currentLang];

            document.getElementById('txt-header-title').innerText = t.headerTitle;
            document.getElementById('txt-btn-main').innerText = t.btnMain;
            
            document.getElementById('lbl-location').innerText = t.lblLocation;
            document.getElementById('lbl-task').innerText = t.lblTask;
            document.getElementById('lbl-supervisor').innerText = t.lblSupervisor;
            document.getElementById('supervisor-input').placeholder = t.phSupervisor;
            document.getElementById('lbl-students').innerText = t.lblStudents;
            document.getElementById('students-input').placeholder = t.phStudents;

            document.getElementById('txt-btn-upload').innerText = t.btnUpload;
            
            const submitBtn = document.getElementById('submit-btn');
            if(!isSubmitting) {
                submitBtn.innerText = t.btnSubmit;
            } else {
                submitBtn.innerText = t.btnSubmitting;
            }

            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'TR' : 'AR';

            populateSelect('location-select', t.locations);
            populateSelect('task-select', t.tasks);

            updatePreviewUI();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'tr' : 'ar';
            updateLanguageUI();
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        function handleFileSelect(event) {
            const t = translations[currentLang];
            const files = Array.from(event.target.files);
            
            for (let file of files) {
                if (selectedFiles.length >= 10) {
                    alert(t.msgMaxFiles);
                    break;
                }
                selectedFiles.push(file);
            }

            event.target.value = "";
            updatePreviewUI();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updatePreviewUI();
        }

        function updatePreviewUI() {
            const t = translations[currentLang];
            const countLabel = document.getElementById('file-count');
            const grid = document.getElementById('preview-grid');
            
            countLabel.innerText = selectedFiles.length > 0 
                ? t.fileCountText(selectedFiles.length)
                : t.fileCountZero;

            grid.innerHTML = "";
            selectedFiles.forEach((file, index) => {
                const itemContainer = document.createElement('div');
                itemContainer.className = 'preview-item';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '✕';
                removeBtn.onclick = () => removeFile(index);

                itemContainer.appendChild(img);
                itemContainer.appendChild(removeBtn);
                grid.appendChild(itemContainer);
            });
        }

        function resizeImage(file, maxWidth = 800, quality = 0.5) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve({
                            name: file.name,
                            type: 'image/jpeg',
                            data: canvas.toDataURL('image/jpeg', quality)
                        });
                    };
                };
            });
        }

        async function uploadDataToDrive() {
            const t = translations[currentLang];

            const location = document.getElementById('location-select').value;
            const task = document.getElementById('task-select').value;
            const supervisor = document.getElementById('supervisor-input').value.trim();
            const students = document.getElementById('students-input').value.trim();

            if (!location || !task || !supervisor) {
                alert(t.msgFillFields);
                return;
            }

            if (selectedFiles.length === 0) {
                alert(t.msgNoFiles);
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = t.btnSubmitting;

            try {
                const compressedFiles = await Promise.all(
                    selectedFiles.map(file => resizeImage(file))
                );

                const payload = {
                    location: location,
                    task: task,
                    supervisor: supervisor,
                    students: students,
                    files: compressedFiles
                };

                document.getElementById('payload-input').value = JSON.stringify(payload);
                isSubmitting = true;

                document.getElementById('hidden-form').submit();

            } catch (err) {
                console.error(err);
                alert(t.msgError);
                submitBtn.disabled = false;
                submitBtn.innerText = t.btnSubmit;
                isSubmitting = false;
            }
        }

        function onUploadComplete() {
            const t = translations[currentLang];
            alert(t.msgSuccess);
            isSubmitting = false;
            selectedFiles = [];

            document.getElementById('supervisor-input').value = '';
            document.getElementById('students-input').value = '';

            updatePreviewUI();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.innerText = t.btnSubmit;
            navigateTo('home-page');
        }

        window.onload = function() {
            updateLanguageUI();
        };
    </script>
</body>
</html>
